# Minimal TheHive config for lab use. Adjust before production use.
search {
  index = thehive
  uri = "http://elasticsearch:9200"
}

# Paste the API key generated in Cortex's UI (Organization -> API Keys) here
# after first setup, then restart the thehive container.
cortex {
  servers = [
    {
      name = "local-cortex"
      url = "http://cortex:9001"
      auth {
        type = "bearer"
        key = "PASTE_CORTEX_API_KEY_HERE"
      }
      wsConfig {}
    }
  ]
}

play.http.secret.key = "CHANGE_ME_TO_A_RANDOM_STRING"
