# TheHive + Cortex — SOAR starter compose file
#
# TheHive handles case management/alerting; Cortex runs the automated analyzers
# and responders that TheHive calls out to (your "playbook" actions).
#
# Usage:
#   1. cp .env.example .env   (edit values as needed — never commit the real .env)
#   2. docker compose up -d
#   3. TheHive UI:  http://<VM-IP>:9000   (first run walks you through creating
#      the initial admin account)
#   4. Cortex UI:   http://<VM-IP>:9001   (create an org + API key, then paste
#      that key into TheHive's admin settings to connect the two)
#
# ARCHITECTURE NOTE: this is a minimal 3-container EVALUATION stack (TheHive
# falls back to its built-in local database when no Cassandra host is given —
# an officially supported mode for lab/testing, not production). StrangeBee's
# production reference architecture instead uses Cassandra + Elasticsearch +
# MinIO across more containers — see https://github.com/StrangeBeeCorp/docker
# if you outgrow this and want a persistent, production-shaped layout.
#
# VERSION NOTE (verified via web search, last checked 2026-08-10):
#   - strangebee/thehive uses rolling minor-version tags, e.g. `5.7` always
#     tracks the latest 5.7.x patch. Confirm the current latest minor at
#     https://hub.docker.com/r/strangebee/thehive/tags before deploying.
#   - thehiveproject/cortex `latest` is the actively maintained tag (Cortex 4.x
#     as of this check) — Cortex's numbered tags are inconsistent, so `latest`
#     is the documented recommendation rather than a guess. Pin to a specific
#     digest once you've confirmed a version at
#     https://hub.docker.com/r/thehiveproject/cortex/tags if you want
#     reproducible builds.
#   - No production compose file should ever float on `latest` long-term —
#     revisit and pin both images once your lab environment stabilizes.

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.9
    restart: on-failure
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data_vol:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"

  cortex:
    image: thehiveproject/cortex:latest
    restart: on-failure
    depends_on:
      - elasticsearch
    ports:
      - "9001:9001"
    environment:
      - job_directory=/tmp/cortex-jobs
    volumes:
      - cortex_jobs_vol:/tmp/cortex-jobs
      - ./cortex/application.conf:/etc/cortex/application.conf

  thehive:
    image: strangebee/thehive:5.7
    restart: on-failure
    depends_on:
      - elasticsearch
      - cortex
    ports:
      - "9000:9000"
    environment:
      - JVM_OPTS=-Dconfig.file=/etc/thehive/application.conf
    volumes:
      - thehive_data_vol:/opt/thp/thehive/data
      - thehive_index_vol:/opt/thp/thehive/index
      - ./thehive/application.conf:/etc/thehive/application.conf

volumes:
  es_data_vol:
  cortex_jobs_vol:
  thehive_data_vol:
  thehive_index_vol:
