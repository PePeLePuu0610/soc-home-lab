name: Docs Deploy

# The "CD" half of the pipeline: only runs after a push lands on main
# (i.e., after docs-ci.yml has already passed on the PR that got merged).
# Builds the MkDocs site and publishes it to the gh-pages branch, which
# GitHub Pages serves at https://PePeLePuu0610.github.io/soc-home-lab/
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    name: Build and Deploy to GitHub Pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Deploy with MkDocs
        run: mkdocs gh-deploy --force --clean
