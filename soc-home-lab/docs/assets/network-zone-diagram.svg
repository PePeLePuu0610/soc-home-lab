<svg width="680" height="430" viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" role="img">
<title>SOC home lab network diagram</title>
<desc>Internet connects through pfSense's WAN interface. pfSense routes to three LAN zones: Management, Corporate, and Attacker, each on its own subnet with its own VMs.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="240" y="20" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="38" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Internet (ISP)</text>
<text x="340" y="54" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">via VMware NAT (VMnet8)</text>

<line x1="340" y1="64" x2="340" y2="100" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="356" y="85" font-family="sans-serif" font-size="12" fill="#5F5E5A">WAN interface</text>

<rect x="240" y="100" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="120" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">pfSense firewall</text>
<text x="340" y="138" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">WAN + 3 LAN interfaces</text>

<line x1="340" y1="156" x2="140" y2="200" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="156" x2="340" y2="200" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="340" y1="156" x2="540" y2="200" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="50" y="200" width="180" height="190" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="140" y="228" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Management zone</text>
<text x="140" y="246" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">10.10.10.0/24</text>
<text x="140" y="268" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">SIEM (ELK / Splunk)</text>
<text x="140" y="286" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">Wazuh manager</text>
<text x="140" y="304" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">OpenVAS</text>
<text x="140" y="322" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#085041">SOAR</text>

<rect x="250" y="200" width="180" height="190" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="228" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Corporate LAN</text>
<text x="340" y="246" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">10.10.20.0/24</text>
<text x="340" y="268" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">Windows Server (AD)</text>
<text x="340" y="286" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#712B13">Windows victim VM</text>

<rect x="450" y="200" width="180" height="190" rx="12" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="540" y="228" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#501313">Attacker zone</text>
<text x="540" y="246" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#791F1F">10.10.30.0/24</text>
<text x="540" y="268" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#791F1F">Kali Linux</text>
</svg>
